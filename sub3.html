<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub 3 Courses Show More</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    section {
      padding: 50px 20px;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      text-align: center;
    }

    h2 {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 2rem;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

      p.subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 40px;
    } 

    .card-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      margin-bottom: 5rem;
    }

    .card {
      position: relative;
      width: 340px;
      height: 190px;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s, box-shadow 0.3s;
      opacity: 1;
       background-color: #fff;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .card-content {
      position: relative;
      padding: 15px;
      color: white;
      font-weight: bold;
      text-align: left;
      z-index: 1;
    }

    .subject {
      font-size: 21px;
    }

    .class {
      font-size: 17px;
      margin-top: 5px;
      font-weight: normal;
    }

    .card button {
      position: relative;
      margin: 0 auto 12px auto;
      padding: 10px 18px;
      background: #00a7fa;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 2px;
      transition: background 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }

    .card button:hover {
      background: #0088cc;
    }

    .more-btn {
      padding: 12px 24px;
      background: #00aeff;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 12px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 1px;
    }

    .more-btn:hover {
      background: #0088cc;
      transform: translateY(-3px);
    }

    /* Hidden cards (initial) */
    .hidden {
      display: none;
      opacity: 0;
    }

    /* Fade-in animation */
    .fade-in {
      display: flex !important;
      animation: fadeIn 0.6s ease forwards;
    }

    .fade-out {
      animation: fadeOut 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>

  <section>

     <h1>  <i class="fas fa-book-open"></i> </h1>
    <h2> Popular Courses</h2>
    <p class="subtitle">Pick a subject to get started</p>

    <br>

    <div class="card-container" id="cardContainer">
      <!-- Card 1 -->
      <div class="card" style="background-image: url('https://i.ytimg.com/vi/5qap5aO4i9A/maxresdefault.jpg');">
        <div class="card-content">
          <div class="subject">Physics</div>
          <div class="class">Class 11</div>
        </div>
        <button><i class="fas fa-arrow-right"></i> Enter Subject</button>
      </div>

      <!-- Card 2 -->
      <div class="card" style="background-image: url('https://i.ytimg.com/vi/DLX62G4lc44/maxresdefault.jpg');">
        <div class="card-content">
          <div class="subject">Chemistry</div>
          <div class="class">Class 12</div>
        </div>
        <button><i class="fas fa-arrow-right"></i> Enter Subject</button>
      </div>

      <!-- Card 3 -->
      <div class="card" style="background-image: url('https://i.ytimg.com/vi/2Vv-BfVoq4g/maxresdefault.jpg');">
        <div class="card-content">
          <div class="subject">Maths</div>
          <div class="class">Class 10</div>
        </div>
        <button><i class="fas fa-arrow-right"></i> Enter Subject</button>
      </div>

      <!-- Card 4 -->
      <div class="card" style="background-image: url('https://i.ytimg.com/vi/tgbNymZ7vqY/maxresdefault.jpg');">
        <div class="card-content">
          <div class="subject">Biology</div>
          <div class="class">Class 9</div>
        </div>
        <button><i class="fas fa-arrow-right"></i> Enter Subject</button>
      </div>

      <!-- Extra Cards (hidden initially) -->
      <div class="card hidden" style="background-image: url('https://i.ytimg.com/vi/ScMzIvxBSi4/maxresdefault.jpg');">
        <div class="card-content">
          <div class="subject">English</div>
          <div class="class">Class 12</div>
        </div>
        <button><i class="fas fa-arrow-right"></i> Enter Subject</button>
      </div>

      <div class="card hidden" style="background-image: url('https://i.ytimg.com/vi/aqz-KE-bpKQ/maxresdefault.jpg');">
        <div class="card-content">
          <div class="subject">Computer Science</div>
          <div class="class">Class 11</div>
        </div>
        <button><i class="fas fa-arrow-right"></i> Enter Subject</button>
      </div>
    </div>

    <button class="more-btn" id="toggleBtn">
      <i class="fas fa-th"></i> More Subjects
    </button>
  </section>

  <script>
    const toggleBtn = document.getElementById("toggleBtn");
    const hiddenCards = document.querySelectorAll(".card.hidden");
    let expanded = false;

    toggleBtn.addEventListener("click", () => {
      expanded = !expanded;

      hiddenCards.forEach(card => {
        if (expanded) {
          card.classList.remove("hidden", "fade-out");
          card.classList.add("fade-in");
        } else {
          card.classList.remove("fade-in");
          card.classList.add("fade-out");

          // animation end par hide karna
          card.addEventListener("animationend", () => {
            if (!expanded) card.classList.add("hidden");
          }, { once: true });
        }
      });

      toggleBtn.innerHTML = expanded 
        ? '<i class="fas fa-chevron-up"></i> Show less'
        : '<i class="fas fa-th"></i> Browse more courses';
    });
  </script>
</body>
</html>
